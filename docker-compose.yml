version: '3.8'

services:
  app:
    build: .
    container_name: laravel-vmush
    volumes:
      - .:/var/www/html
    networks:
      - laravel_net
    working_dir: /var/www/html

  nginx:
    image: nginx:alpine
    container_name: nginx-web
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel_net

networks:
  laravel_net:
