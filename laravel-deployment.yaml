apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      containers:
      - name: laravel-app
        image: rzaynuri/laravel-app:latest
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: laravel-configmap     # <-- harus ini, bukan laravel-env
        - secretRef:
            name: laravel-secret
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo -n "base64:K7Uu3Q5EXAMPLEKEY123456==" | base64;
            echo -n "laravel" | base64;
            echo -n "secret" | base64;
            # ganti dengan command utama container, contoh:
            php-fpm;
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-service
spec:
  type: LoadBalancer
  selector:
    app: laravel-app
  ports:
    - port: 80
      targetPort: 80
