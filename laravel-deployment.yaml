apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      containers:
      - name: laravel-app
        image: rzaynuri/laravel-vmush:latest
        ports:
        - containerPort: 9000
        envFrom:
        - secretRef:
            name: laravel-secret
        volumeMounts:
        - name: storage
          mountPath: /var/www/html/storage
        - name: bootstrap-cache
          mountPath: /var/www/html/bootstrap/cache
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: laravel-storage-pvc
      - name: bootstrap-cache
        persistentVolumeClaim:
          claimName: laravel-storage-pvc
