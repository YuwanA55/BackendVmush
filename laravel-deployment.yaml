apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      containers:
      - name: laravel-app
        image: rzaynuri/laravel-app:latest
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: laravel-configmap
        - secretRef:
            name: laravel-secret
        command: ["php", "artisan"]
        args: ["serve", "--host=0.0.0.0", "--port=80"]
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-service
spec:
  type: NodePort
  selector:
    app: laravel-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
