apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laravel
  template:
    metadata:
      labels:
        app: laravel
    spec:
      containers:
        - name: laravel
          image: your-dockerhub-username/laravel-app:latest
          ports:
            - containerPort: 80
          env:
            - name: APP_ENV
              value: production
