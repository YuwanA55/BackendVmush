services:
  app:
    image: rzaynuri/laravel-vmush:latest
    volumes:
      - .:/var/www/html
    networks:
      - laravel_net
    working_dir: /var/www/html
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel_net
