apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      containers:
      - name: laravel-app
        image: rzaynuri/laravel-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-service
spec:
  type: LoadBalancer          # ubah dari NodePort ke LoadBalancer
  selector:
    app: laravel-app
  ports:
    - port: 80
      targetPort: 80
      # nodePort dihapus, biar MetalLB atur otomatis
